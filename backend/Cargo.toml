[package]
name = "atlas-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "sqlite", "postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = "0.3"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand = "0.8"
ring = "0.17"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
anyhow = "1"
thiserror = "2"
regex = "1"
quick-xml = { version = "0.38", features = ["serialize"] }
dotenvy = "0.15"
jsonwebtoken = { package = "jsonwebtoken", version = "9" }
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
