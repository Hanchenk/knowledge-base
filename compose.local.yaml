name: atlas-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.15.4
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY}
    ports: ["127.0.0.1:16333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: ["object_data:/data"]
    restart: unless-stopped
  storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        attempts=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          attempts=$$((attempts + 1))
          [ "$$attempts" -lt 30 ] || exit 1
          sleep 2
        done
        mc mb --ignore-existing local/atlas
        mc anonymous set none local/atlas
        mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc admin policy create local atlas-service /config/atlas-policy.json
        mc admin policy attach local atlas-service --user "$$S3_ACCESS_KEY"
    volumes: ["./deploy/atlas-policy.json:/config/atlas-policy.json:ro"]
volumes:
  postgres_data:
  qdrant_data:
  object_data:
